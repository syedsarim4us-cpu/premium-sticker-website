<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - 3D Sticker Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
  body {
    background: radial-gradient(circle at top, #1a0033, #000000);
    color: white;
    min-height: 100vh;
    font-family: sans-serif;
  }
  .glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .neon-text {
    background: linear-gradient(90deg,#ff00cc,#00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  input, textarea, select {
    background: rgba(255,255,255,0.08) !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    color: white !important;
    transition: all 0.3s ease;
  }

  select option {
    background-color: #1a0033 !important;
    color: white !important;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #ff00cc !important;
    box-shadow: 0 0 15px rgba(255, 0, 204, 0.3);
  }

  .social-btn {
    height: 50px;
    width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05) !important;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: white;
    text-decoration: none;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    outline: none !important;
  }

  .social-btn:hover {
    transform: translateY(-5px);
    background: rgba(255, 255, 255, 0.12) !important;
  }

  .social-btn.ig:hover { color: #ff00cc; border-color: #ff00cc !important; }
  .social-btn.fb:hover { color: #1877F2; border-color: #1877F2 !important; }
  .social-btn.x:hover { color: #ffffff; border-color: #ffffff !important; }
  .social-btn.wa:hover { color: #25D366; border-color: #25D366 !important; }
</style>
</head>
<body>

<nav class="p-6 max-w-7xl mx-auto flex justify-between items-center">
  <a href="index.html" class="text-xl font-bold neon-text hover:opacity-80 transition">← Back to Home</a>
</nav>

<main class="max-w-4xl mx-auto px-6 py-10">
  <div class="text-center mb-12">
    <h1 class="text-5xl font-black neon-text uppercase tracking-tighter">Help Center</h1>
    <p class="text-gray-400 mt-4">Questions about your order or need a custom sticker design?</p>
  </div>

  <div class="grid md:grid-cols-2 gap-10">
    <div class="glass p-8 rounded-[30px] border border-white/10 shadow-2xl">
      <form action="#" class="space-y-6" onsubmit="event.preventDefault(); alert('Ticket Submitted Successfully!');">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Reason for Contact</label>
          <select class="w-full p-4 rounded-xl outline-none cursor-pointer">
            <option value="" disabled selected>Select a reason</option>
            <option>Order Support</option>
            <option>Custom Sticker Request</option>
            <option>Payment Issue</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Full Name</label>
          <input type="text" class="w-full p-4 rounded-xl" placeholder="John Doe" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Email Address</label>
          <input type="email" class="w-full p-4 rounded-xl" placeholder="email@example.com" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Message</label>
          <textarea class="w-full p-4 rounded-xl h-32" placeholder="Describe your issue or request..." required></textarea>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-pink-600 to-blue-600 py-4 rounded-xl font-bold hover:scale-105 transition shadow-lg uppercase tracking-widest text-sm active:scale-95">
          Submit Ticket
        </button>
      </form>
    </div>

    <div class="flex flex-col justify-start space-y-6">
      <div class="glass p-8 rounded-3xl border border-white/5">
        <h3 class="text-pink-500 font-black text-sm uppercase tracking-widest mb-4">Official Support</h3>
        <p class="text-xl font-light text-gray-300">Email us at:<br><span class="text-white font-bold">support@3dstickervault.com</span></p>
      </div>

      <div class="glass p-8 rounded-3xl border border-white/5">
        <h3 class="text-blue-400 font-black text-sm uppercase tracking-widest mb-4">Custom Assets</h3>
        <p class="text-gray-400 leading-relaxed">We accept custom 3D sticker commissions for clothing brands. Response time: <span class="text-white font-bold">24-48 hours</span>.</p>
      </div>

      <div class="p-4 border-t border-white/10 mt-4">
        <p class="text-xs text-gray-500 uppercase font-bold mb-6 tracking-widest text-center md:text-left">Follow Our Drops</p>
        <div class="flex justify-center md:justify-start gap-4">
          <a id="ig-link" href="#" target="_blank" class="social-btn ig"><i class="fab fa-instagram text-xl"></i></a>
          <a id="fb-link" href="#" target="_blank" class="social-btn fb"><i class="fab fa-facebook-f text-xl"></i></a>
          <a id="x-link" href="#" target="_blank" class="social-btn x"><i class="fab fa-x-twitter text-xl"></i></a>
          <a id="wa-link" href="#" target="_blank" class="social-btn wa"><i class="fab fa-whatsapp text-xl"></i></a>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  // --- APNE LINKS YAHAN UPDATE KAREIN ---
  const socialLinks = {
    instagram: "https://www.instagram.com/your_username", 
    facebook: "https://www.facebook.com/your_page",
    x: "https://x.com/your_handle",
    whatsapp: "https://wa.me/923001234567" // Number format: CountryCodeNumber
  };

  // Setting the links automatically
  document.getElementById('ig-link').href = socialLinks.instagram;
  document.getElementById('fb-link').href = socialLinks.facebook;
  document.getElementById('x-link').href = socialLinks.x;
  document.getElementById('wa-link').href = socialLinks.whatsapp;
</script>

</body>
</html>
